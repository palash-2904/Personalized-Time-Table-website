<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognifyx</title>
  <meta name="description" content="Weekly class timetable with forgetting-curve revision reminders." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand"><span class="brand__mark" aria-hidden="true">C</span> Cognifyx</div>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button role="tab" data-view="today" aria-selected="true">Today</button>
        <button role="tab" data-view="week" aria-selected="false">Week</button>
        <button role="tab" data-view="classes" aria-selected="false">Classes</button>
        <button role="tab" data-view="method" aria-selected="false">Method</button>
      </nav>
      <span class="badge" id="modeBadge" title="">…</span>
    </div>
  </header>

  <main class="wrap">
    <div id="banner" class="banner" hidden></div>
    <section id="view-today" class="view"></section>
    <section id="view-week" class="view" hidden></section>
    <section id="view-classes" class="view" hidden></section>
    <section id="view-method" class="view" hidden></section>
  </main>

  <dialog id="dialog"></dialog>
  <script src="scheduler.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
